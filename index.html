<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Figuras en Canvas</title>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">

            <!-- Rectángulo -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-primary text-white">
                        <h5>Rectángulo</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasRect" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Triángulo -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-success text-white">
                        <h5>Triángulo</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasTriang" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Cara Feliz -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-warning">
                        <h5>Cara Feliz</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasCara" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Línea -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-danger text-white">
                        <h5>Línea</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasLinea" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Figuras -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-info text-white">
                        <h5>Figuras</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasFiguras" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Triángulos -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-secondary text-white">
                        <h5>Triángulos</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasTriangulos" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Corazón -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-danger text-white">
                        <h5>Corazón</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasCorazon" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

            <!-- Path2D -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-dark text-white">
                        <h5>Path2D</h5>
                    </div>
                    <div class="card-body text-center">
                        <canvas id="canvasPath2D" width="300" height="300"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
